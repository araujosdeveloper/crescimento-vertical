# =============================================================================
# Fase 2A — Blue-green staging (Payload + PostgreSQL).
#
# Projeto exclusivo: crescimento-vertical-phase2-staging
#   - cv-phase2-staging-app
#   - cv-phase2-staging-postgres
#   - cv-phase2-staging-migrate (one-shot, perfil "migrate")
#
# NÃO substitui docker-compose.yml (produção) nem docker-compose.staging.yml
# (staging antigo). O staging antigo permanece ativo como fallback de rollback.
#
# Rede interna exclusiva (app + postgres) sem porta publicada. A aplicação
# também entra na rede externa n8n_default SOMENTE para o Traefik alcançá-la.
# O postgres NÃO participa de n8n_default.
#
# Roteamento controlado por PHASE2_TRAEFIK_ENABLE (default false). Quando true,
# o router do candidate assume o Host do staging com prioridade superior à do
# staging antigo.
# =============================================================================
name: crescimento-vertical-phase2-staging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL}
        - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        - NEXT_PUBLIC_WHATSAPP_DISPLAY=${NEXT_PUBLIC_WHATSAPP_DISPLAY:-}
        - NEXT_PUBLIC_WHATSAPP_MESSAGE=${NEXT_PUBLIC_WHATSAPP_MESSAGE:-}
        - SITE_NOINDEX=true
    image: cv-phase2-staging-app:latest
    container_name: cv-phase2-staging-app
    # UID não-root da imagem; GID 0 somente para ler o secret 0640 root:root.
    user: "1001:0"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_MEDIA_DIR: /app/media
      SITE_NOINDEX: ${SITE_NOINDEX}
      LEAD_NOTIFICATION_ENABLED: ${LEAD_NOTIFICATION_ENABLED:-false}
      LEAD_SMTP_HOST: ${LEAD_SMTP_HOST:-smtp.hostinger.com}
      LEAD_SMTP_PORT: ${LEAD_SMTP_PORT:-465}
      LEAD_SMTP_SECURE: ${LEAD_SMTP_SECURE:-true}
      LEAD_SMTP_USER: ${LEAD_SMTP_USER:-contato@crescimentovertical.com}
      LEAD_SMTP_FROM: ${LEAD_SMTP_FROM:-contato@crescimentovertical.com}
      LEAD_NOTIFICATION_TO: ${LEAD_NOTIFICATION_TO:-contato@crescimentovertical.com}
      LEAD_SMTP_PASSWORD_FILE: /run/secrets/lead_smtp_password
      LEAD_ADMIN_BASE_URL: ${LEAD_ADMIN_BASE_URL:-https://staging.crescimentovertical.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    volumes:
      - media:/app/media
      - type: bind
        source: /opt/crescimento-vertical/.secrets/lead-smtp-password
        target: /run/secrets/lead_smtp_password
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      - 'traefik.enable=${PHASE2_TRAEFIK_ENABLE:-false}'
      - 'traefik.docker.network=n8n_default'
      - 'traefik.http.routers.cv-phase2-staging.rule=Host(`${STAGING_HOST}`)'
      - 'traefik.http.routers.cv-phase2-staging.entrypoints=websecure'
      - 'traefik.http.routers.cv-phase2-staging.tls=true'
      - 'traefik.http.routers.cv-phase2-staging.tls.certresolver=mytlschallenge'
      - 'traefik.http.routers.cv-phase2-staging.priority=200'
      - 'traefik.http.routers.cv-phase2-staging.middlewares=cv-phase2-staging-robots,cv-phase2-staging-basicauth'
      - 'traefik.http.middlewares.cv-phase2-staging-basicauth.basicauth.users=${STAGING_BASIC_AUTH_USERS}'
      - 'traefik.http.middlewares.cv-phase2-staging-robots.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive'
      - 'traefik.http.services.cv-phase2-staging.loadbalancer.server.port=3000'

  postgres:
    image: postgres:16-alpine
    container_name: cv-phase2-staging-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sem `ports`: o banco nunca é exposto publicamente na VPS.
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: cv-phase2-staging-migrate:latest
    profiles: ["migrate"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
  n8n_default:
    external: true

volumes:
  media:
  postgres-data:
