# =============================================================================
# Fase 2A — Compose de VALIDAÇÃO da fundação editorial (Payload + PostgreSQL).
#
# Este arquivo NÃO substitui docker-compose.yml nem docker-compose.staging.yml.
# Ele usa nomes de projeto/serviço/volume exclusivos e não deve ser implantado
# em produção agora: serve para validar a topologia dedicada do banco e da
# mídia persistente sem tocar nos projetos ativos.
#
# Rede interna dedicada (app + banco) sem porta PostgreSQL publicada na VPS.
# O app também entra na rede externa n8n_default SOMENTE para o Traefik
# alcançá-lo (mesma regra dos projetos ativos).
# =============================================================================
name: crescimento-vertical-cms

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://crescimentovertical.com}
        - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL:-contato@crescimentovertical.com}
        - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        - NEXT_PUBLIC_WHATSAPP_DISPLAY=${NEXT_PUBLIC_WHATSAPP_DISPLAY:-}
        - NEXT_PUBLIC_WHATSAPP_MESSAGE=${NEXT_PUBLIC_WHATSAPP_MESSAGE:-}
        - SITE_NOINDEX=${SITE_NOINDEX:-false}
    image: crescimento-vertical-cms:latest
    container_name: crescimento-vertical-cms
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crescimento_vertical}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - n8n_default
    volumes:
      - media:/app/media
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    labels:
      # Exemplo da futura exposição via Traefik (Fase 3+). O host real e a
      # regra de publicação serão definidos quando o CMS for para produção.
      - 'traefik.enable=true'
      - 'traefik.docker.network=n8n_default'
      - 'traefik.http.routers.crescimento-vertical-cms.rule=Host(`${CMS_HOST:-cms.crescimentovertical.com}`)'
      - 'traefik.http.routers.crescimento-vertical-cms.entrypoints=websecure'
      - 'traefik.http.routers.crescimento-vertical-cms.tls=true'
      - 'traefik.http.routers.crescimento-vertical-cms.tls.certresolver=mytlschallenge'
      - 'traefik.http.services.crescimento-vertical-cms.loadbalancer.server.port=3000'

  postgres:
    image: postgres:16-alpine
    container_name: crescimento-vertical-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crescimento_vertical}
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sem `ports`: o banco nunca é exposto publicamente na VPS.
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  internal:
  n8n_default:
    external: true

volumes:
  media:
  postgres-data:
