# =============================================================================
# Fase 3B — Runner editorial isolado do Hermes.
#
# Projeto exclusivo: crescimento-vertical-hermes-editorial
#   - cv-hermes-editorial-runner
#
# Regras: sem ports publicados, sem labels Traefik, sem Docker Socket,
# sem acesso a Payload/PostgreSQL. Execução desabilitada nesta fase.
# =============================================================================
name: crescimento-vertical-hermes-editorial

services:
  phase8-egress-proxy:
    build:
      context: .
      dockerfile: services/phase8-egress-proxy/Dockerfile
    image: cv-phase8-egress-proxy:8157454
    container_name: cv-phase8-egress-proxy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=8m,mode=1777
    expose:
      - "3128"
    networks:
      - phase8_execution
      - phase8_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',3128),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M
          pids: 32

  cv-hermes-editorial-runner:
    build:
      context: .
      dockerfile: services/hermes-editorial-runner/Dockerfile
    image: cv-hermes-editorial-runner:phase8-hermes-logs-f0638ac
    container_name: cv-hermes-editorial-runner
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /opt/data:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid=10000,gid=10000
    environment:
      RUNNER_EXECUTION_ENABLED: "false"
      SCHEMAS_DIR: /app/schemas
      HERMES_HOME: /home/hermes/editorial-profile
      HERMES_BIN: /app/hermes_wrapper.py
      HOME: /tmp/hermes-home
      HERMES_WRITE_SAFE_ROOT: /tmp/hermes-work
      HERMES_LAZY_INSTALL_TARGET: /tmp/hermes-lazy-packages
      HERMES_STREAM_RETRIES: "0"
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek-api-key
      TAVILY_API_KEY_FILE: /run/secrets/tavily-api-key
      HTTP_PROXY: http://phase8-egress-proxy:3128
      HTTPS_PROXY: http://phase8-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost
      RUNNER_STATE_DIR: /state
      RUNNER_FAILURE_DIR: /state/failures
      MAX_TURNS: "8"
      MAX_WEB_SEARCHES: "3"
      MAX_FINAL_SOURCES: "4"
      JOB_TIMEOUT_SECONDS: "300"
      OUTPUT_MAX_BYTES: "262144"
    volumes:
      - type: bind
        source: ${EDITORIAL_PROFILE_PATH}
        target: /home/hermes/editorial-profile
        read_only: true
      - type: bind
        source: ./.secrets/hmac-secret
        target: /run/secrets/hmac-secret
        read_only: true
      - type: bind
        source: ./.secrets/hermes-editorial-deepseek-api-key
        target: /run/secrets/deepseek-api-key
        read_only: true
      - type: bind
        source: ./.secrets/hermes-editorial-tavily-api-key
        target: /run/secrets/tavily-api-key
        read_only: true
      - runner-state:/state
    expose:
      - "8100"
    networks:
      - phase8_execution
    depends_on:
      phase8-egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /opt/hermes/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
          pids: 64

networks:
  phase8_execution:
    internal: true
  phase8_egress: {}

volumes:
  runner-state:
