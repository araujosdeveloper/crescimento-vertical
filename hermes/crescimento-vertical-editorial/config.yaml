# Configuração do perfil crescimento-vertical-editorial
#
# Perfil de pesquisa editorial em modo somente-leitura de rede (web).
# Nenhuma credencial de modelo é definida aqui. O runner injeta a credencial
# DeepSeek exclusiva somente no subprocesso one-shot autorizado.

model:
  provider: deepseek
  default: deepseek-v4-flash
  max_tokens: 4096

# Sem fallback automático para OpenAI ou qualquer outro provedor.
fallback_providers: []

# Apenas o toolset de pesquisa web (web_search / web_extract).
# Terminal, shell, edição, filesystem, browser, code_execution e mensagens
# ficam desabilitados por ausência de toolset.
toolsets:
  - web

terminal:
  home_mode: profile
  cwd: .

agent:
  max_turns: 8
  api_max_retries: 1
  reasoning_effort: none
  loop_caps:
    max_web_searches: 3

web:
  extract_char_limit: 12000
