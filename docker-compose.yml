services:
  crescimento-vertical:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL
        - NEXT_PUBLIC_CONTACT_EMAIL
        - NEXT_PUBLIC_WHATSAPP_NUMBER
        - NEXT_PUBLIC_WHATSAPP_DISPLAY
        - NEXT_PUBLIC_WHATSAPP_MESSAGE
        - SITE_NOINDEX=false
    container_name: crescimento-vertical
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - n8n_default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=n8n_default'
      - 'traefik.http.routers.crescimento-vertical.rule=Host(`crescimentovertical.com`) || Host(`www.crescimentovertical.com`)'
      - 'traefik.http.routers.crescimento-vertical.entrypoints=websecure'
      - 'traefik.http.routers.crescimento-vertical.tls=true'
      - 'traefik.http.routers.crescimento-vertical.tls.certresolver=mytlschallenge'
      - 'traefik.http.services.crescimento-vertical.loadbalancer.server.port=3000'

networks:
  n8n_default:
    external: true
