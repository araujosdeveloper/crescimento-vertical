name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, migrate e build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Valores descartáveis de CI — nunca usar segredos reais neste workflow.
      DATABASE_URL: postgresql://payload:payload@localhost:5432/payload_ci
      PAYLOAD_SECRET: ci-only-dummy-secret-value-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payload_ci
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Migrations (banco efêmero)
        run: |
          npm run migrate
          npm run migrate:status

      - name: Build
        run: npm run build

  hermes-editorial-runner:
    name: hermes-editorial-runner (Python, schemas, docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Instalar jsonschema 4.26.0 (pinado)
        run: pip install "jsonschema==4.26.0"

      - name: Testes do runner (unittest)
        run: |
          cd services/hermes-editorial-runner
          python -m unittest discover -s tests -t .

      - name: Validar quatro schemas (Draft 2020-12)
        run: |
          python - << 'PY'
          import json, glob
          from jsonschema import Draft202012Validator
          for p in sorted(glob.glob("docs/schemas/*.schema.json")):
              Draft202012Validator.check_schema(json.load(open(p)))
              print("OK", p)
          PY

      - name: Verificar execução desabilitada (sem ports/Traefik/Docker Socket)
        run: |
          set -euo pipefail
          grep -q 'RUNNER_EXECUTION_ENABLED: "false"' docker-compose.hermes-editorial.yml
          if grep -qE '^[[:space:]]*ports:' docker-compose.hermes-editorial.yml; then echo "ERRO: ports publicados"; exit 1; fi
          if grep -qiE 'traefik\.' docker-compose.hermes-editorial.yml; then echo "ERRO: label Traefik"; exit 1; fi
          if grep -q 'docker.sock' docker-compose.hermes-editorial.yml services/hermes-editorial-runner/Dockerfile; then echo "ERRO: Docker Socket"; exit 1; fi
          echo "OK: execução desabilitada, sem ports/Traefik/Docker Socket"

      - name: Compose config (valores fictícios, secret temporário)
        env:
          EDITORIAL_PROFILE_PATH: /tmp/fake-profile
        run: |
          mkdir -p .secrets /tmp/fake-profile
          printf 'ci-fake-hmac-secret-not-used-anywhere-1234567890' > .secrets/hmac-secret
          docker compose -f docker-compose.hermes-editorial.yml config --quiet

      - name: Docker build do runner (imagem Hermes pinada por digest)
        run: |
          docker build -f services/hermes-editorial-runner/Dockerfile -t cv-hermes-editorial-runner:ci .

  n8n-hermes-connector:
    name: n8n-hermes-connector (node package, workflows, docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/n8n-nodes-crescimento-vertical/package-lock.json

      - name: Instalar dependências
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm ci

      - name: Lint
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm run lint

      - name: Typecheck
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm run typecheck

      - name: Testes
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm test

      - name: Build
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm run build

      - name: npm pack --dry-run
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: npm pack --dry-run

      - name: Auditoria do pacote (ausência de secrets)
        working-directory: packages/n8n-nodes-crescimento-vertical
        run: |
          set -euo pipefail
          if grep -rniE "BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}" dist/ package.json; then
            echo "ERRO: possível secret no pacote"; exit 1
          fi
          echo "OK: sem secrets no pacote"

      - name: Validar workflows versionados (JSON e sem secrets)
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, glob
          for p in sorted(glob.glob("n8n/workflows/*.json")):
              data = json.load(open(p))
              assert isinstance(data, dict), p
              print("OK", p)
          PY

      - name: Docker compose config (valores fictícios)
        env:
          SUBDOMAIN: fake
          DOMAIN_NAME: example.com
          GENERIC_TIMEZONE: America/Sao_Paulo
          MERCADO_PAGO_WEBHOOK_SECRET: fake-secret-not-real
          N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
          NODE_FUNCTION_ALLOW_BUILTIN: ""
        run: |
          docker compose -f services/n8n-crescimento-vertical/docker-compose.n8n.yml config --quiet

      - name: Docker build da imagem n8n customizada (digest pinado)
        run: |
          set -o pipefail
          build_log="$(mktemp)"
          trap 'rm -f "$build_log"' EXIT

          for attempt in 1 2 3 4; do
            echo "Tentativa ${attempt} de 4 do docker build n8n"
            : > "$build_log"

            if docker build -f services/n8n-crescimento-vertical/Dockerfile -t cv-n8n-hermes-connector:ci . 2>&1 | tee "$build_log"; then
              exit 0
            else
              build_status=$?
            fi

            if ! grep -Eqi 'HTTP 429|Too Many Requests|toomanyrequests|rate limit' "$build_log"; then
              echo "Docker build falhou por erro não relacionado a rate limit; sem retry."
              exit "$build_status"
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Docker build falhou após 4 ocorrências de rate limit."
              exit "$build_status"
            fi

            case "$attempt" in
              1) wait_seconds=60 ;;
              2) wait_seconds=120 ;;
              3) wait_seconds=240 ;;
            esac
            echo "Rate limit transitório detectado; nova tentativa em ${wait_seconds}s."
            sleep "$wait_seconds"
          done

  secret-scan:
    name: secret-scan (gitleaks full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks no histórico completo
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
